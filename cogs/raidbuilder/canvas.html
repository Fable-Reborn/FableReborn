function position(id){const i=nodes().findIndex(n=>n.id===id),p=spec().layout?.[id];return p&&Number.isFinite(p.x)&&Number.isFinite(p.y)?{x:Math.max(0,Math.min(3700,p.x)),y:Math.max(0,Math.min(2700,p.y))}:{x:50+i%4*285,y:50+Math.floor(i/4)*250};}
function edges(node){const result=[];if(!['choice','ending'].includes(node.kind))result.push({label:'Next',object:node,key:'next',color:'#80d5b0'});if(['battle','trial','check','choice'].includes(node.kind))result.push({label:node.kind==='choice'?'Tie / timeout':'Failure',object:node,key:'failure',color:'#ed8c97'});if(node.kind==='choice')for(const c of node.choices)result.push({label:c.label,object:c,key:'next',color:'#8baff8'});for(const r of node.rules)if(r.effect==='transition')result.push({label:r.id,object:r,key:'destination',color:'#e0bc75'});return result;}
function svgPath(x1,y1,x2,y2,color){const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M ${x1} ${y1} C ${x1+100} ${y1}, ${x2-100} ${y2}, ${x2} ${y2}`);p.setAttribute('fill','none');p.setAttribute('stroke',color);p.setAttribute('stroke-width','2');return p;}
function drawWires(){const svg=document.querySelector('#board svg');if(!svg)return;svg.replaceChildren();const boardRect=$('board').getBoundingClientRect();for(const n of nodes()){const element=document.querySelector(`[data-node="${n.id}"]`);if(!element)continue;edges(n).forEach((edge,i)=>{const destination=nodes().find(x=>x.id===edge.object[edge.key]);const port=element.querySelectorAll('.port')[i];if(!destination||!port)return;const p=port.getBoundingClientRect(),to=position(destination.id);svg.append(svgPath(p.right-boardRect.left-7,p.top-boardRect.top+p.height/2,to.x,to.y+40,edge.color));});}if(wire)svg.append(svgPath(wire.x,wire.y,wire.toX,wire.toY,'#e0bc75'));}
function startWire(event,node,edge){event.preventDefault();event.stopPropagation();const rect=$('board').getBoundingClientRect(),port=event.currentTarget.getBoundingClientRect();wire={x:port.right-rect.left-7,y:port.top-rect.top+port.height/2,toX:event.clientX-rect.left,toY:event.clientY-rect.top};const move=e=>{wire.toX=e.clientX-rect.left;wire.toY=e.clientY-rect.top;drawWires();};const up=e=>{document.removeEventListener('pointermove',move);document.removeEventListener('pointerup',up);const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-node]')?.dataset.node;wire=null;if(target)change(()=>edge.object[edge.key]=target);else drawWires();};document.addEventListener('pointermove',move);document.addEventListener('pointerup',up);drawWires();}
function dragNode(event,node,element){if(event.target.closest('.port')||event.button!==0)return;event.preventDefault();selected=node.id;tab='step';document.querySelectorAll('.node').forEach(e=>e.classList.toggle('selected',e.dataset.node===selected));renderInspector();const before=JSON.stringify(pack),start=position(node.id),x=event.clientX,y=event.clientY;element.setPointerCapture(event.pointerId);const move=e=>{const p={x:Math.max(0,Math.min(3700,start.x+e.clientX-x)),y:Math.max(0,Math.min(2700,start.y+e.clientY-y))};spec().layout[node.id]=p;element.style.left=p.x+'px';element.style.top=p.y+'px';drawWires();};const up=()=>{element.removeEventListener('pointermove',move);element.removeEventListener('pointerup',up);record(before);updateHeader();};element.addEventListener('pointermove',move);element.addEventListener('pointerup',up);}
function renderBoard(){const board=$('board');board.replaceChildren(document.createElementNS('http://www.w3.org/2000/svg','svg'));for(const n of nodes()){const p=position(n.id),node=el('article',{class:'node'+(n.id===selected?' selected':''),'data-node':n.id,tabIndex:0,onkeydown:e=>{if(e.key==='Enter'){selected=n.id;tab='step';render();}}});node.style.left=p.x+'px';node.style.top=p.y+'px';node.append(el('div',{class:'head'},el('div',{class:'kind',text:(n.id===spec().start?'START · ':'')+n.kind}),el('strong',{text:n.title}),el('small',{text:`${n.rules.length} rules${n.kind==='battle'?' · '+(n.enemies?.length||1)+' enemies':''}`})));const ports=el('div',{class:'ports'});for(const edge of edges(n)){const port=el('div',{class:'port'+(edge.key==='failure'?' failure':''),onpointerdown:e=>startWire(e,n,edge)},el('span',{text:edge.label+' → '+(nodes().find(x=>x.id===edge.object[edge.key])?.title||'choose step')}));port.style.color=edge.color;ports.append(port);}if(ports.childNodes.length)node.append(ports);node.addEventListener('pointerdown',e=>dragNode(e,n,node));board.append(node);}drawWires();}
function updateHeader(){$('raid-name').textContent=raid().name;$('counts').textContent=`${nodes().length}/100 steps · ${spec().roles.length} roles · ${spec().statuses.length} statuses`;$('undo').disabled=!undo.length;$('redo').disabled=!redo.length;}
function render(){spec().layout??={};renderBoard();renderInspector();updateHeader();}
function report(titleText,items){$('report-title').textContent=titleText;$('report-body').replaceChildren(el('ul',{},...items.map(t=>el('li',{text:t}))));$('report').showModal();}
function validate(){const errors=[],s=spec(),ids=new Set(nodes().map(n=>n.id)),roles=new Set(s.roles.map(r=>r.id)),teams=new Set(s.teams.map(t=>t.id)),statuses=new Set(s.statuses.map(t=>t.id)),resources=new Set(s.resources.map(t=>t.id));const integer=(v,lo,hi)=>Number.isInteger(v)&&v>=lo&&v<=hi;
for(const[name,items,max]of [['steps',nodes(),100],['roles',s.roles,25],['teams',s.teams,25],['statuses',s.statuses,25],['actions',s.actions,25],['resources',s.resources,25]]){if(items.length>max)errors.push(`Too many ${name} (maximum ${max}).`);if(new Set(items.map(x=>x.id)).size!==items.length)errors.push(`Duplicate IDs in ${name}.`);for(const i of items)if(!/^[a-z][a-z0-9_-]{0,63}$/.test(i.id))errors.push(`Invalid ${name} ID: ${i.id}.`);}
if(!ids.has(s.start))errors.push('Choose an existing starting step.');if(!s.teams.length||!s.roles.length)errors.push('Keep at least one team and role.');if(!s.roles.some(r=>r.slots===0))errors.push('Keep one unlimited fallback role.');if(!integer(s.player_hp,1,1000000)||!integer(s.max_steps,1,1000))errors.push('Check default health and engine step limit.');for(const r of s.roles){if(!teams.has(r.team))errors.push(`Role ${r.label} needs a valid team.`);if(!integer(r.hp,0,1000000)||!integer(r.slots,0,1000))errors.push(`Check health/slots for ${r.label}.`);if(!s.actions.some(a=>!a.cost&&(!a.roles?.length||a.roles.includes(r.id))))errors.push(`Role ${r.label} needs a free fallback action.`);}for(const r of s.resources)if(!integer(r.min,-1000000,1000000)||!integer(r.max,r.min,1000000)||!integer(r.initial,r.min,r.max))errors.push(`Check bounds for ${r.label}.`);for(const t of s.statuses)if(!integer(t.duration,1,100)||!integer(t.max_stacks,1,25)||!integer(t.damage_dealt_pct,0,1000)||!integer(t.damage_taken_pct,0,1000))errors.push(`Check duration/stacks/modifiers for ${t.label}.`);
const checkEffect=(e,label)=>{if(!effects.includes(e.effect))errors.push(`Unknown effect on ${label}.`);if(!integer(e.amount,e.effect==='resource'?-1000000:0,1000000))errors.push(`Invalid amount on ${label}.`);if(e.effect==='apply_status'&&!integer(e.amount,1,25))errors.push(`Status stacks on ${label} must be 1–25.`);if(['apply_status','remove_status'].includes(e.effect)&&!statuses.has(e.status))errors.push(`Choose a status on ${label}.`);if(e.effect==='resource'&&!resources.has(e.resource))errors.push(`Choose a resource on ${label}.`);if(e.effect==='transition'&&!ids.has(e.destination))errors.push(`Choose a transition destination on ${label}.`);};
function checkCondition(c,n,depth=0,count={v:0}){if(!c||typeof c!=='object'||depth>8||++count.v>64){errors.push(`Condition on ${n.title} exceeds its limits.`);return;}const group=['all','any','not'].find(k=>k in c);if(group){const children=group==='not'?[c.not]:c[group];if(!Array.isArray(children)||!children.length){errors.push(`Empty condition group on ${n.title}.`);return;}children.forEach(x=>checkCondition(x,n,depth+1,count));}else if(c.operator!=='always'&&(!subjects(n).some(x=>x[0]===c.subject)||!integer(c.value,-1000000,1000000)))errors.push(`Invalid comparison on ${n.title}.`);}
for(const a of s.actions){checkEffect(a,a.label);if(a.effect==='transition')errors.push('Use a rule for transitions.');if(a.roles?.some(r=>!roles.has(r)))errors.push(`Unknown role on ${a.label}.`);if(a.cost&&!resources.has(a.cost_resource))errors.push(`Choose a cost resource on ${a.label}.`);}
const graph=new Map();for(const n of nodes()){if(!n.title?.trim()||n.title.length>256||n.text.length>3500)errors.push(`Check title/text on ${n.id}.`);const links=edges(n).map(e=>e.object[e.key]);graph.set(n.id,links);for(const link of links)if(!ids.has(link))errors.push(`${n.title} links to a missing step.`);if(n.kind==='choice'&&n.choices.length<2)errors.push(`${n.title} needs at least two choices.`);if(n.kind==='battle'&&!integer(n.max_rounds,1,100))errors.push(`Check round limit on ${n.title}.`);if(n.enemies?.length>25)errors.push(`${n.title} exceeds 25 enemies.`);for(const e of n.enemies||[])if(!integer(e.hp,1,1000000)||!integer(e.damage,0,1000000)||(e.on_hit_status&&!statuses.has(e.on_hit_status)))errors.push(`Check enemy ${e.label}.`);if(n.kind==='check')checkCondition(n.condition||{subject:n.subject,operator:n.operator,value:n.value},n);for(const r of n.rules){checkEffect(r,r.id);checkCondition(r.condition||{subject:r.subject,operator:r.operator,value:r.value},n);if(!integer(r.limit,1,100))errors.push(`Check repeat limit on ${r.id}.`);if(r.trigger.startsWith('round')&&n.kind!=='battle')errors.push(`Round rule ${r.id} needs a battle step.`);if(r.trigger==='choice'&&n.kind!=='choice')errors.push(`Choice rule ${r.id} needs a choice step.`);}}
const reachable=new Set(),pending=[s.start];while(pending.length){const k=pending.pop();if(!reachable.has(k)){reachable.add(k);pending.push(...(graph.get(k)||[]));}}const endings=new Set(nodes().filter(n=>n.kind==='ending').map(n=>n.id));let changed=true;while(changed){changed=false;for(const[k,v]of graph)if(!endings.has(k)&&v.some(x=>endings.has(x))){endings.add(k);changed=true;}}for(const k of reachable)if(ids.has(k)&&!endings.has(k))errors.push(`${nodes().find(n=>n.id===k).title} has no path to an ending.`);return [...new Set(errors)];}
$('validate').onclick=()=>{const errors=validate();report(errors.length?'Fix these before importing':'Canvas checks passed',errors.length?errors:['Your encounter passes the canvas checks. Discord performs full engine validation when you import and publish.','Use Validate / Simulate in the Discord builder to run the real encounter engine without rewards.']);};
$('download').onclick=()=>{localSave();const data=new Blob([JSON.stringify(pack,null,2)],{type:'application/json'}),url=URL.createObjectURL(data),a=el('a',{href:url,download:`${pack.definition_id}.raid.json`});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$('save-state').textContent=`File downloaded • Attach to raidmode import ${pack.definition_id}`;};
$('help').onclick=()=>report('Save to your raid library',[`Download Save File, then attach the downloaded .raid.json file to: raidmode import ${pack.definition_id}`,'Your browser autosave is local. Importing saves to PostgreSQL; publishing happens in Discord.','If Discord says the draft changed, export a fresh canvas. Your downloaded file remains available to compare.','Saved limit: 5 raids. Draft limit: 10 total across normal and advanced. Rewards stay in the Discord reward editor.']);
$('close-report').onclick=()=>$('report').close();$('open-file').onclick=()=>$('file-input').click();$('file-input').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>1000000)throw new Error('Save file is larger than 1 MB.');const candidate=JSON.parse(await file.text());if(candidate.schema!==pack.schema||candidate.version!==1||candidate.definition_id!==pack.definition_id||candidate.base_digest!==pack.base_digest)throw new Error('Choose a save from this draft and exported revision.');if(!candidate.definition?.config?.encounter?.nodes||!Array.isArray(candidate.definition.config.encounter.nodes))throw new Error('Missing encounter steps.');change(()=>{pack=candidate;selected=spec().start;});}catch(error){report('Could not open save',[error.message]);}e.target.value='';};

$('undo').onclick=()=>{if(undo.length){redo.push(JSON.stringify(pack));pack=JSON.parse(undo.pop());localSave();render();}};$('redo').onclick=()=>{if(redo.length){undo.push(JSON.stringify(pack));pack=JSON.parse(redo.pop());localSave();render();}};
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){e.preventDefault();$(e.shiftKey?'redo':'undo').click();}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();$('redo').click();}});
